name: Pre-market scan

on:
  schedule:
    # Mon–Fri 12:45 UTC = 8:45 ET (summer, EDT) / 7:45 ET (winter, EST) — before the 9:30 ET open
    - cron: "45 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run scanner
        env:
          BENZINGA_API_KEY: ${{ secrets.BENZINGA_API_KEY }}
        run: python -m premarket_scanner --watchlist watchlist.txt -v
      - name: Commit daily result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          git diff --cached --quiet || git commit -m "Pre-market scan $(TZ=America/New_York date +%F)"
          git push
